{% extends 'base.html' %}
{% block content %}

<style>
    /* Unified Card Styling */
    .enroll-card {
        background-color: #1a1a1a !important; /* Dark charcoal */
        padding: 40px;
        max-width: 850px;
        width: 100%; /* Ensures centering */
        margin: 40px auto;
        border-radius: 20px !important;
        border: 1px solid #333 !important;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
        overflow: hidden;
    }

    .enroll-input, .enroll-select {
        width: 100%;
        padding: 14px;
        border-radius: 12px; /* Smoother corners */
        outline: none;
        box-sizing: border-box;
        font-size: 1rem;
        transition: all 0.3s ease;
        background-color: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid #444 !important;
        color: #ffffff !important;
    }

    /* Fix: dropdown options inherit the white text but get a white OS background,
       making text invisible. Force a dark background on every option. */
    .enroll-select option {
        background-color: #1e1e1e;
        color: #ffffff;
    }

    .enroll-input:focus, .enroll-select:focus {
        background-color: rgba(255, 255, 255, 0.1) !important;
        border-color: #b30000 !important;
        box-shadow: 0 0 0 4px rgba(179, 0, 0, 0.2) !important;
    }

    /* Grid Layout */
    .enroll-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .full-width { grid-column: span 2; }

    /* Section Header Styling */
    .section-title {
        grid-column: span 2;
        color: #b30000;
        font-size: 1.1rem;
        font-weight: 800;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
        margin-top: 25px;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    label {
        color: #eee;
        font-weight: 700;
        margin-bottom: 8px;
        display: block;
        font-size: 0.9rem;
    }

    .req-tag {
        font-size: 0.7rem;
        font-weight: 800;
        color: #b30000;
        background: #fff5f5;
        padding: 2px 8px;
        border-radius: 4px;
        float: right;
    }

    .screening-box {
        background: rgba(179, 0, 0, 0.05);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(179, 0, 0, 0.1);
    }
</style>

<div style="background-color: var(--bg-color); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px;">
    <div class="enroll-card">

        <div style="text-align: center; margin-bottom: 40px;">
            <h2 style="color: #b30000; font-size: 2.2rem; font-weight: 800; margin: 0;">Donor Enrollment</h2>
            <p style="color: #888; margin-top: 10px;">Complete your medical profile to start saving lives</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="enroll-grid">
                <div class="section-title">👤 Basic Information</div>

                <div class="full-width">
                    <label>Full Name</label>
                    <input type="text" name="name" class="enroll-input" placeholder="Enter your legal name" required>
                </div>

                <div class="full-width">
                    <label>Profile Picture <span class="req-tag">Optional</span></label>
                    <input type="file" name="profile_pic" class="enroll-input" accept="image/*" style="padding: 10px;">
                </div>

                <div>
                    <label>Age <span class="req-tag">18 - 65 yrs</span></label>
                    <input type="number" name="age" id="ageInput"
                           class="enroll-input"
                           min="18" max="65"
                           oninput="validateDonorEligibility()"
                           required>
                    <small id="age_err" style="display:none; color:#f56565; font-size:0.78rem; margin-top:5px; display:none;"></small>
                </div>

                <div>
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="enroll-input" placeholder="e.g. +91..." required>
                </div>

                <div class="full-width">
                    <label>Gender</label>
                    <select name="gender" class="enroll-select" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="section-title">⚖️ Physical Metrics</div>

                <div>
                    <label>Weight (kg) <span class="req-tag">Min 45kg</span></label>
                    <input type="number" step="0.1" name="weight" id="weightInput"
                           class="enroll-input"
                           min="45"
                           oninput="validateDonorEligibility()"
                           required>
                    <small id="weight_err" style="display:none; color:#f56565; font-size:0.78rem; margin-top:5px;"></small>
                </div>

                <div>
                    <label>Height (cm) <span class="req-tag">Required</span></label>
                    <input type="number" name="height" class="enroll-input" required>
                </div>

                <div class="section-title">💉 Clinical Details</div>

                <div class="full-width">
                    <label>Blood Group</label>
                    <select name="blood_group" class="enroll-select" required>
                        <option value="" disabled selected>Select Group</option>
                        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                    </select>
                </div>

                <div>
                    <label>District</label>
                    <input type="text" name="district" class="enroll-input" placeholder="e.g. Kottayam" required>
                </div>
                <div>
                    <label>Home Town / City</label>
                    <input type="text" name="city" class="enroll-input" placeholder="e.g. Pala" required>
                </div>

                <div class="section-title">🛡️ Health Screening</div>

                <div class="full-width">
                    <div class="screening-box">
                        <label style="display: flex; gap: 15px; cursor: pointer; margin-bottom: 15px; color: white;">
                            <input type="checkbox" required style="width: 20px; height: 20px; accent-color: #b30000;">
                            <span>I confirm no major surgery or tattoos in last 6 months.</span>
                        </label>
                        <label style="display: flex; gap: 15px; cursor: pointer; margin: 0; color: white;">
                            <input type="checkbox" required style="width: 20px; height: 20px; accent-color: #b30000;">
                            <span>I am currently healthy and not taking regular medications.</span>
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" id="enrollBtn"
                    style="width: 100%; padding: 18px; background: #b30000; color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; margin-top: 30px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(179, 0, 0, 0.4);">
                Complete Enrollment
            </button>
        </form>
    </div>
</div>

<script>
function validateDonorEligibility() {
    const ageInput   = document.getElementById('ageInput');
    const weightInput = document.getElementById('weightInput');
    const ageErr     = document.getElementById('age_err');
    const weightErr  = document.getElementById('weight_err');
    const btn        = document.getElementById('enrollBtn');

    let valid = true;

    // --- Age check ---
    const age = parseInt(ageInput.value, 10);
    if (ageInput.value !== '' && (isNaN(age) || age < 18 || age > 65)) {
        ageErr.textContent = age < 18
            ? '❌ Donors must be at least 18 years old.'
            : '❌ Donors must be 65 years old or younger.';
        ageErr.style.display = 'block';
        ageInput.style.borderColor = '#f56565';
        valid = false;
    } else {
        ageErr.style.display = 'none';
        ageInput.style.borderColor = '';
    }

    // --- Weight check ---
    const weight = parseFloat(weightInput.value);
    if (weightInput.value !== '' && (isNaN(weight) || weight < 45)) {
        weightErr.textContent = '❌ Donors must weigh at least 45 kg.';
        weightErr.style.display = 'block';
        weightInput.style.borderColor = '#f56565';
        valid = false;
    } else {
        weightErr.style.display = 'none';
        weightInput.style.borderColor = '';
    }

    // Enable / disable submit
    btn.disabled        = !valid;
    btn.style.opacity   = valid ? '1' : '0.5';
    btn.style.cursor    = valid ? 'pointer' : 'not-allowed';
}

// Also validate on form submit as a final safety net
document.querySelector('form').addEventListener('submit', function(e) {
    const age    = parseInt(document.getElementById('ageInput').value, 10);
    const weight = parseFloat(document.getElementById('weightInput').value);

    if (age < 18 || age > 65 || weight < 45) {
        e.preventDefault();
        validateDonorEligibility();
    }
});
</script>

{% endblock %}
