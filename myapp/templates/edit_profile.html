{% extends 'base.html' %}
{% block content %}

<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

    <div style="
    background: #121212; /* Solid dark fallback */
    background: rgba(18, 18, 18, 0.95); /* Deep dark transparency */
    backdrop-filter: blur(15px);
    border: 1px solid #333;
    padding: 40px;
    border-radius: 24px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    color: white;">

        <h2 style="text-align: center; margin-bottom: 30px; font-weight: 800; letter-spacing: -1px;">
            Update <span style="color: #b30000;">Profile</span>
        </h2>

        <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 20px;">
            {% csrf_token %}

            <div style="text-align: center; margin-bottom: 10px;">
                <img src="{% if donor.profile_pic %}{{ donor.profile_pic.url }}{% else %}/static/images/default.png{% endif %}"
                     style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #b30000; padding: 3px;">
                <p style="font-size: 0.7rem; color: #888; margin-top: 10px;">Current Profile Image</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label style="font-size: 0.75rem; color: #ffc107; font-weight: bold;">FULL NAME</label>
                <input type="text" name="name" value="{{ donor.name }}"
                       style="padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 10px; color: white; outline: none;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label style="font-size: 0.75rem; color: #ffc107; font-weight: bold;">WHATSAPP NUMBER</label>
                <input type="text" name="phone" value="{{ donor.phone }}"
                       style="padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 10px; color: white; outline: none;">
            </div>

            <div style="display: flex; gap: 15px; width: 100%; box-sizing: border-box; margin-bottom: 20px;">

                <div style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 0.75rem; color: #ffc107; font-weight: bold;">CITY</label>
                    <input type="text" name="city" value="{{ donor.city }}"
                           style="width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 10px; color: white; outline: none; box-sizing: border-box;">
                </div>

                <div style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 0.75rem; color: #ffc107; font-weight: bold;">DISTRICT</label>
                    <input type="text" name="district" value="{{ donor.district }}"
                           style="width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 10px; color: white; outline: none; box-sizing: border-box;">
                </div>

            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label style="font-size: 0.75rem; color: #ffc107; font-weight: bold;">CHANGE PHOTO</label>
                <input type="file" name="profile_pic" style="font-size: 0.8rem; color: #888;">
            </div>

            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px;">
                <button type="submit"
                        style="background: #b30000; color: white; padding: 14px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s;"
                        onmouseover="this.style.background='#ff0000'; this.style.transform='scale(1.02)';"
                        onmouseout="this.style.background='#b30000'; this.style.transform='scale(1)';">
                    SAVE CHANGES
                </button>
                <a href="{% url 'donor_dashboard' %}"
                   style="text-align: center; color: #666; text-decoration: none; font-size: 0.8rem; font-weight: bold;">
                    Cancel and Return to Dashboard
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
